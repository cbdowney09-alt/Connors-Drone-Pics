<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KnoxCanvas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22253a;
  --border:rgba(255,255,255,0.08);--text:#f0f2ff;--text2:#8b90b0;--accent:#4f6ef7;
}
html,body{height:100%;width:100%;background:var(--bg);font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;min-height:100vh}
#logo{font-size:34px;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px}
#logo span{color:var(--accent)}
#tagline{font-size:14px;color:var(--text2);margin-bottom:40px;text-align:center}
#buttons{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.landing-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;-webkit-appearance:none}
.landing-btn.primary{background:var(--accent);color:#fff}
.landing-btn.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.landing-btn:active{opacity:0.85}
#footnote{margin-top:28px;font-size:12px;color:var(--text2);text-align:center;max-width:300px}
</style>
</head>
<body>
  <div id="logo">Knox<span>Canvas</span></div>
  <div id="tagline">Door-to-door sales tracking</div>

  <div id="buttons">
    <a class="landing-btn primary" href="app.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Login
    </a>
    <a class="landing-btn secondary" href="docs/test.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Test Tool
    </a>
  </div>

  <div id="footnote">Test Tool works without an account — search zip codes and check house ages.</div>
</body>
</html>
