<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Knoxville Canvas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22253a;
    --border: rgba(255,255,255,0.08);
    --text: #f0f2ff;
    --text2: #8b90b0;
    --accent: #4f6ef7;

    --c-none:     #6b7280;
    --c-hanger:   #f59e0b;
    --c-interest: #10b981;
    --c-no:       #ef4444;
    --c-dnr:      #7c3aed;
  }

  html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text); }

  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: var(--bg);
    padding: env(safe-area-inset-top, 16px) 16px 12px;
    padding-top: max(env(safe-area-inset-top), 16px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }

  #header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  #header h1 span { color: var(--accent); }

  #stats-row {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  }

  .stat-pill {
    font-size: 11px; font-weight: 600; padding: 3px 8px;
    border-radius: 20px; letter-spacing: 0.2px;
    display: flex; align-items: center; gap: 4px;
  }
  .stat-pill .dot { width: 7px; height: 7px; border-radius: 50%; }

  #map {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
  }

  .leaflet-tile-pane { filter: brightness(1); }

  /* Bottom sheet */
  #sheet {
    position: fixed; bottom: 0; left: 0; right: 0;
    z-index: 2000;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    border-top: 1px solid var(--border);
    padding: 0 0 max(env(safe-area-inset-bottom), 20px);
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    max-height: 70vh;
    overflow-y: auto;
  }
  #sheet.open { transform: translateY(0); }

  #sheet-handle {
    width: 36px; height: 4px; background: rgba(255,255,255,0.2);
    border-radius: 2px; margin: 12px auto 0;
  }

  #sheet-addr {
    font-size: 15px; font-weight: 600; padding: 16px 20px 4px;
    line-height: 1.3;
  }
  #sheet-coords { font-size: 12px; color: var(--text2); padding: 0 20px 16px; }

  .status-btn {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px;
    border: none; background: transparent; color: var(--text);
    width: 100%; text-align: left; font-size: 15px; cursor: pointer;
    border-top: 1px solid var(--border);
    transition: background 0.12s;
    -webkit-appearance: none;
  }
  .status-btn:active { background: var(--surface2); }
  .status-btn .swatch { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .status-btn .check { margin-left: auto; font-size: 18px; opacity: 0; }
  .status-btn.active .check { opacity: 1; }
  .status-btn.active { background: var(--surface2); }

  #sheet-note-row {
    padding: 8px 20px 4px;
    border-top: 1px solid var(--border);
  }
  #sheet-note {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 14px;
    padding: 10px 12px; resize: none; font-family: inherit;
    outline: none;
  }
  #sheet-note::placeholder { color: var(--text2); }

  #sheet-close {
    display: block; margin: 12px 20px 0;
    background: var(--accent); color: #fff;
    border: none; border-radius: 12px; padding: 13px;
    font-size: 15px; font-weight: 600; cursor: pointer; width: calc(100% - 40px);
    -webkit-appearance: none;
  }
  #sheet-close:active { opacity: 0.85; }

  /* Overlay to close sheet */
  #overlay {
    position: fixed; inset: 0; z-index: 1500;
    background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  #overlay.visible { opacity: 1; pointer-events: all; }

  /* Legend / filter panel */
  #legend {
    position: fixed; bottom: max(env(safe-area-inset-bottom), 20px); right: 12px;
    z-index: 900; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;
    min-width: 160px;
  }
  .legend-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text2); cursor: pointer;
    padding: 2px 0;
  }
  .legend-row .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-row.active { color: var(--text); }
  .legend-row.active .label-count { color: var(--text2); }
  .label-count { margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; }

  #header-inner { display: flex; flex-direction: column; gap: 6px; flex: 1; }

  /* Search bar */
  #search-wrap {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1100;
    pointer-events: none;
  }
  #search-bar {
    margin: 0 12px;
    margin-top: max(env(safe-area-inset-top), 16px);
    margin-top: calc(max(env(safe-area-inset-top), 16px) + 56px);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; display: flex; align-items: center;
    padding: 0 12px; gap: 8px; pointer-events: all;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  #search-bar svg { flex-shrink: 0; opacity: 0.5; }
  #search-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 14px; padding: 11px 0;
    font-family: inherit;
  }
  #search-input::placeholder { color: var(--text2); }
  #search-results {
    position: fixed; left: 12px; right: 12px; z-index: 1200;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    display: none;
  }
  .search-result {
    padding: 12px 16px; font-size: 14px; cursor: pointer;
    border-top: 1px solid var(--border); color: var(--text2);
  }
  .search-result:first-child { border-top: none; }
  .search-result:active { background: var(--surface2); }
  .search-result strong { color: var(--text); }

  #export-btn {
    background: transparent; border: 1px solid var(--border);
    border-radius: 10px; padding: 8px; color: var(--text2);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #export-btn:active { background: var(--surface2); }

  #sheet-delete {
    display: block; margin: 8px 20px 0;
    background: transparent; color: #ef4444;
    border: 1px solid rgba(239,68,68,0.3); border-radius: 12px; padding: 12px;
    font-size: 14px; font-weight: 500; cursor: pointer; width: calc(100% - 40px);
    -webkit-appearance: none;
  }
  #sheet-delete:active { background: rgba(239,68,68,0.1); }

  /* Export panel */
  #export-panel {
    position: fixed; inset: 0; z-index: 3000;
    background: var(--bg);
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    overflow-y: auto;
    padding-bottom: max(env(safe-area-inset-bottom), 24px);
  }
  #export-panel.open { transform: translateX(0); }

  #export-header {
    display: flex; align-items: center; gap: 12px;
    padding: max(env(safe-area-inset-top), 16px) 16px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 10;
  }
  #export-back {
    background: transparent; border: 1px solid var(--border);
    border-radius: 10px; padding: 7px; color: var(--text2);
    cursor: pointer; display: flex; align-items: center;
  }
  #export-back:active { background: var(--surface2); }
  #export-header h2 { font-size: 17px; font-weight: 600; }

  #export-summary {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    padding: 16px;
  }
  .export-stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
  }
  .export-stat .es-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .export-stat .es-val { font-size: 22px; font-weight: 600; }

  #export-filters { padding: 0 16px 12px; }
  .filter-label { font-size: 12px; color: var(--text2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

  #export-status-toggles { display: flex; flex-wrap: wrap; gap: 8px; }
  .etoggle {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface);
    font-size: 13px; color: var(--text2); cursor: pointer;
    -webkit-appearance: none;
  }
  .etoggle .dot { width: 8px; height: 8px; border-radius: 50%; }
  .etoggle.on { color: var(--text); border-color: rgba(255,255,255,0.2); background: var(--surface2); }

  #export-preview-wrap { padding: 0 16px 16px; }
  #export-preview {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; max-height: 260px; overflow-y: auto;
  }
  .ep-row {
    display: grid; grid-template-columns: 1fr auto;
    padding: 10px 12px; border-top: 1px solid var(--border); gap: 8px;
    align-items: start;
  }
  .ep-row:first-child { border-top: none; }
  .ep-addr { font-size: 13px; color: var(--text); line-height: 1.3; }
  .ep-date { font-size: 11px; color: var(--text2); white-space: nowrap; }
  .ep-status { font-size: 11px; font-weight: 600; margin-top: 2px; }
  .ep-empty { padding: 20px; text-align: center; font-size: 13px; color: var(--text2); }

  #export-csv-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 0 16px; background: var(--accent); color: #fff;
    border: none; border-radius: 12px; padding: 14px;
    font-size: 15px; font-weight: 600; cursor: pointer; width: calc(100% - 32px);
    -webkit-appearance: none;
  }
  #export-csv-btn:active { opacity: 0.85; }
  .leaflet-bottom.leaflet-right { bottom: 160px !important; }

  /* pulse animation for new pin */
  @keyframes pulse-ring {
    0% { transform: scale(0.5); opacity: 0.8; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  #toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.75); color: #fff; font-size: 13px;
    padding: 8px 16px; border-radius: 20px; z-index: 9999;
    pointer-events: none; opacity: 0; transition: opacity 0.3s;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="map"></div>

<div id="header">
  <div id="header-inner">
    <h1>Knox<span>Canvas</span></h1>
    <div id="stats-row"></div>
  </div>
  <button id="export-btn" title="Export data">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  </button>
</div>

<div id="search-wrap">
  <div id="search-bar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search-input" type="text" placeholder="Search Knoxville address…" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div id="search-results"></div>
</div>

<div id="overlay"></div>

<div id="sheet">
  <div id="sheet-handle"></div>
  <div id="sheet-addr">Select a location</div>
  <div id="sheet-coords"></div>
  <button class="status-btn" data-status="none">
    <span class="swatch" style="background:var(--c-none)"></span>
    Not visited
    <span class="check">✓</span>
  </button>
  <button class="status-btn" data-status="hanger">
    <span class="swatch" style="background:var(--c-hanger)"></span>
    Door hanger left
    <span class="check">✓</span>
  </button>
  <button class="status-btn" data-status="interest">
    <span class="swatch" style="background:var(--c-interest)"></span>
    Spoke to someone — interested
    <span class="check">✓</span>
  </button>
  <button class="status-btn" data-status="no">
    <span class="swatch" style="background:var(--c-no)"></span>
    Spoke to someone — not interested
    <span class="check">✓</span>
  </button>
  <button class="status-btn" data-status="dnr">
    <span class="swatch" style="background:var(--c-dnr)"></span>
    Do not return / skip
    <span class="check">✓</span>
  </button>
  <div id="sheet-note-row">
    <textarea id="sheet-note" rows="2" placeholder="Add a note (optional)…"></textarea>
  </div>
  <button id="sheet-delete">Remove this pin</button>
  <button id="sheet-close">Done</button>
</div>

<div id="legend">
  <div class="legend-row active" data-filter="all">
    <div class="dot" style="background:rgba(255,255,255,0.2)"></div>
    <span>All pins</span>
    <span class="label-count" id="cnt-all">0</span>
  </div>
  <div class="legend-row active" data-filter="none">
    <div class="dot" style="background:var(--c-none)"></div>
    <span>Not visited</span>
    <span class="label-count" id="cnt-none">0</span>
  </div>
  <div class="legend-row active" data-filter="hanger">
    <div class="dot" style="background:var(--c-hanger)"></div>
    <span>Door hanger</span>
    <span class="label-count" id="cnt-hanger">0</span>
  </div>
  <div class="legend-row active" data-filter="interest">
    <div class="dot" style="background:var(--c-interest)"></div>
    <span>Interested</span>
    <span class="label-count" id="cnt-interest">0</span>
  </div>
  <div class="legend-row active" data-filter="no">
    <div class="dot" style="background:var(--c-no)"></div>
    <span>Not interested</span>
    <span class="label-count" id="cnt-no">0</span>
  </div>
  <div class="legend-row active" data-filter="dnr">
    <div class="dot" style="background:var(--c-dnr)"></div>
    <span>Do not return</span>
    <span class="label-count" id="cnt-dnr">0</span>
  </div>
</div>

<div id="export-panel">
  <div id="export-header">
    <button id="export-back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </button>
    <h2>Export data</h2>
  </div>

  <div id="export-summary"></div>

  <div id="export-filters">
    <p class="filter-label">Include statuses</p>
    <div id="export-status-toggles"></div>
  </div>

  <div id="export-preview-wrap">
    <p class="filter-label">Preview <span id="export-count"></span></p>
    <div id="export-preview"></div>
  </div>

  <button id="export-csv-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Download CSV
  </button>
</div>

<div id="toast"></div>

<script>
const COLORS = {
  none:    '#6b7280',
  hanger:  '#f59e0b',
  interest:'#10b981',
  no:      '#ef4444',
  dnr:     '#7c3aed'
};

const LABELS = {
  none: 'Not visited',
  hanger: 'Door hanger',
  interest: 'Interested',
  no: 'Not interested',
  dnr: 'Do not return'
};

// Load saved pins from localStorage
let pins = JSON.parse(localStorage.getItem('knoxPins') || '{}');
// pins[id] = { lat, lng, addr, status, note, ts }

let currentPinId = null;
let markers = {};
let hiddenStatuses = new Set();

// Init map centered on Knoxville
const map = L.map('map', {
  center: [35.9606, -83.9207],
  zoom: 17,
  zoomControl: false,
  attributionControl: false
});

L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
  maxZoom: 22,
  subdomains: '0123',
  attribution: '© Google Maps'
}).addTo(map);

L.control.attribution({ position: 'bottomleft', prefix: false }).addTo(map);

function makeIcon(status) {
  const color = COLORS[status] || COLORS.none;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
    <filter id="ds"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.4"/></filter>
    <path d="M14 2C8.48 2 4 6.48 4 12c0 7 10 22 10 22S24 19 24 12c0-5.52-4.48-10-10-10z" fill="${color}" filter="url(#ds)"/>
    <circle cx="14" cy="12" r="5" fill="rgba(255,255,255,0.3)"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    iconSize: [28, 36],
    iconAnchor: [14, 36],
    popupAnchor: [0, -36],
    className: ''
  });
}

function savePins() {
  localStorage.setItem('knoxPins', JSON.stringify(pins));
}

function addOrUpdateMarker(id) {
  const p = pins[id];
  if (!p) return;
  if (markers[id]) {
    map.removeLayer(markers[id]);
  }
  if (hiddenStatuses.has(p.status)) return;
  const m = L.marker([p.lat, p.lng], { icon: makeIcon(p.status) });
  m.on('click', () => openSheet(id));
  m.addTo(map);
  markers[id] = m;
}

function renderAllMarkers() {
  Object.keys(markers).forEach(id => map.removeLayer(markers[id]));
  markers = {};
  Object.keys(pins).forEach(id => addOrUpdateMarker(id));
  updateStats();
}

function updateStats() {
  const counts = { none: 0, hanger: 0, interest: 0, no: 0, dnr: 0 };
  Object.values(pins).forEach(p => { if (counts[p.status] !== undefined) counts[p.status]++; });
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  document.getElementById('cnt-all').textContent = total;
  Object.keys(counts).forEach(k => {
    document.getElementById('cnt-' + k).textContent = counts[k];
  });

  // Header stats row
  const row = document.getElementById('stats-row');
  row.innerHTML = '';
  const active = [
    { k: 'interest', label: 'Interested' },
    { k: 'hanger', label: 'Hangers' },
    { k: 'no', label: 'No' },
    { k: 'dnr', label: 'DNR' }
  ];
  active.forEach(({ k, label }) => {
    if (counts[k] > 0) {
      const el = document.createElement('div');
      el.className = 'stat-pill';
      el.style.background = COLORS[k] + '22';
      el.style.color = COLORS[k];
      el.innerHTML = `<span class="dot" style="background:${COLORS[k]}"></span>${counts[k]} ${label}`;
      row.appendChild(el);
    }
  });
  if (total > 0) {
    const el = document.createElement('div');
    el.className = 'stat-pill';
    el.style.background = 'rgba(255,255,255,0.05)';
    el.style.color = '#8b90b0';
    el.textContent = total + ' total';
    row.appendChild(el);
  }
}

// Open sheet for existing or new pin
function openSheet(id) {
  currentPinId = id;
  const p = pins[id];
  document.getElementById('sheet-addr').textContent = p.addr || 'Unnamed location';
  document.getElementById('sheet-coords').textContent = p.lat.toFixed(5) + ', ' + p.lng.toFixed(5);
  document.getElementById('sheet-note').value = p.note || '';

  document.querySelectorAll('.status-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.status === p.status);
  });

  document.getElementById('sheet').classList.add('open');
  document.getElementById('overlay').classList.add('visible');
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
  currentPinId = null;
}

document.getElementById('overlay').addEventListener('click', closeSheet);
document.getElementById('sheet-close').addEventListener('click', closeSheet);

document.querySelectorAll('.status-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!currentPinId) return;
    const status = btn.dataset.status;
    pins[currentPinId].status = status;
    pins[currentPinId].ts = Date.now();
    savePins();
    addOrUpdateMarker(currentPinId);
    updateStats();
    document.querySelectorAll('.status-btn').forEach(b => b.classList.toggle('active', b.dataset.status === status));
    showToast('Saved: ' + LABELS[status]);
  });
});

document.getElementById('sheet-note').addEventListener('input', () => {
  if (!currentPinId) return;
  pins[currentPinId].note = document.getElementById('sheet-note').value;
  savePins();
});

// Delete pin
document.getElementById('sheet-delete').addEventListener('click', () => {
  if (!currentPinId) return;
  if (markers[currentPinId]) map.removeLayer(markers[currentPinId]);
  delete markers[currentPinId];
  delete pins[currentPinId];
  savePins();
  updateStats();
  closeSheet();
  showToast('Pin removed');
});

// Export panel
const exportPanel = document.getElementById('export-panel');
let exportIncluded = new Set(['none','hanger','interest','no','dnr']);

document.getElementById('export-btn').addEventListener('click', () => {
  buildExportPanel();
  exportPanel.classList.add('open');
});
document.getElementById('export-back').addEventListener('click', () => {
  exportPanel.classList.remove('open');
});

function buildExportPanel() {
  // Summary stats
  const counts = { none:0, hanger:0, interest:0, no:0, dnr:0 };
  Object.values(pins).forEach(p => { if (counts[p.status] !== undefined) counts[p.status]++; });
  const total = Object.values(counts).reduce((a,b) => a+b, 0);
  document.getElementById('export-summary').innerHTML = `
    <div class="export-stat"><div class="es-label">Total pins</div><div class="es-val">${total}</div></div>
    <div class="export-stat"><div class="es-label" style="color:var(--c-interest)">Interested</div><div class="es-val" style="color:var(--c-interest)">${counts.interest}</div></div>
    <div class="export-stat"><div class="es-label" style="color:var(--c-hanger)">Door hangers</div><div class="es-val" style="color:var(--c-hanger)">${counts.hanger}</div></div>
    <div class="export-stat"><div class="es-label" style="color:var(--c-dnr)">Do not return</div><div class="es-val" style="color:var(--c-dnr)">${counts.dnr}</div></div>
  `;

  // Status toggles
  const toggleWrap = document.getElementById('export-status-toggles');
  toggleWrap.innerHTML = '';
  Object.entries(LABELS).forEach(([k, label]) => {
    const btn = document.createElement('button');
    btn.className = 'etoggle' + (exportIncluded.has(k) ? ' on' : '');
    btn.innerHTML = `<span class="dot" style="background:${COLORS[k]}"></span>${label}`;
    btn.addEventListener('click', () => {
      if (exportIncluded.has(k)) exportIncluded.delete(k);
      else exportIncluded.add(k);
      btn.classList.toggle('on', exportIncluded.has(k));
      buildPreview();
    });
    toggleWrap.appendChild(btn);
  });

  buildPreview();
}

function buildPreview() {
  const rows = Object.values(pins).filter(p => exportIncluded.has(p.status));
  rows.sort((a,b) => b.ts - a.ts);
  document.getElementById('export-count').textContent = `(${rows.length} rows)`;
  const wrap = document.getElementById('export-preview');
  if (!rows.length) {
    wrap.innerHTML = '<div class="ep-empty">No pins match selected filters</div>';
    return;
  }
  wrap.innerHTML = rows.slice(0, 50).map(p => {
    const date = new Date(p.ts).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    return `<div class="ep-row">
      <div>
        <div class="ep-addr">${p.addr || 'Unknown address'}</div>
        <div class="ep-status" style="color:${COLORS[p.status]}">${LABELS[p.status]}</div>
      </div>
      <div class="ep-date">${date}</div>
    </div>`;
  }).join('') + (rows.length > 50 ? `<div class="ep-empty">+ ${rows.length - 50} more in CSV</div>` : '');
}

document.getElementById('export-csv-btn').addEventListener('click', () => {
  const rows = Object.values(pins).filter(p => exportIncluded.has(p.status));
  rows.sort((a,b) => b.ts - a.ts);
  if (!rows.length) { showToast('No data to export'); return; }

  const escape = v => `"${String(v).replace(/"/g,'""')}"`;
  const lines = ['Address,Status,Date Added,Note,Latitude,Longitude'];
  rows.forEach(p => {
    const date = new Date(p.ts).toLocaleDateString('en-US', { month:'2-digit', day:'2-digit', year:'numeric' });
    lines.push([
      escape(p.addr || ''),
      escape(LABELS[p.status] || p.status),
      escape(date),
      escape(p.note || ''),
      escape(p.lat.toFixed(6)),
      escape(p.lng.toFixed(6))
    ].join(','));
  });

  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const today = new Date().toISOString().slice(0,10);
  a.download = `knoxcanvas_${today}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV downloaded');
});
map.on('click', async (e) => {
  const { lat, lng } = e.latlng;
  const id = lat.toFixed(6) + ',' + lng.toFixed(6);
  if (!pins[id]) {
    pins[id] = { lat, lng, addr: 'Loading address…', status: 'none', note: '', ts: Date.now() };
    addOrUpdateMarker(id);
    updateStats();
    savePins();
    reverseGeocode(lat, lng, id);
  }
  openSheet(id);
});

async function reverseGeocode(lat, lng, id) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
    const d = await r.json();
    const addr = d.display_name ? d.display_name.split(',').slice(0, 3).join(',') : `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    if (pins[id]) {
      pins[id].addr = addr;
      savePins();
      if (currentPinId === id) {
        document.getElementById('sheet-addr').textContent = addr;
      }
    }
  } catch (e) {
    if (pins[id]) pins[id].addr = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  }
}

// Legend filter
document.querySelectorAll('#legend .legend-row').forEach(row => {
  row.addEventListener('click', () => {
    const f = row.dataset.filter;
    if (f === 'all') {
      hiddenStatuses.clear();
      document.querySelectorAll('#legend .legend-row').forEach(r => r.classList.add('active'));
    } else {
      if (hiddenStatuses.has(f)) {
        hiddenStatuses.delete(f);
        row.classList.add('active');
      } else {
        hiddenStatuses.add(f);
        row.classList.remove('active');
      }
      const allActive = document.querySelectorAll('#legend .legend-row[data-filter]:not([data-filter="all"]).active').length === 5;
      document.querySelector('#legend .legend-row[data-filter="all"]').classList.toggle('active', allActive);
    }
    renderAllMarkers();
  });
});

// Search
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
let searchTimeout;
let searchTop = 0;

function positionSearchResults() {
  const bar = document.getElementById('search-bar');
  const rect = bar.getBoundingClientRect();
  searchResults.style.top = (rect.bottom + 6) + 'px';
}

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  const q = searchInput.value.trim();
  if (q.length < 3) { searchResults.style.display = 'none'; return; }
  searchTimeout = setTimeout(() => doSearch(q), 400);
});

async function doSearch(q) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q + ' Knoxville Tennessee')}&format=json&limit=5&addressdetails=1`);
    const data = await r.json();
    searchResults.innerHTML = '';
    if (!data.length) {
      searchResults.style.display = 'none';
      return;
    }
    positionSearchResults();
    data.forEach(item => {
      const d = document.createElement('div');
      d.className = 'search-result';
      const parts = item.display_name.split(',');
      d.innerHTML = `<strong>${parts[0]}</strong>, ${parts.slice(1, 3).join(',')}`;
      d.addEventListener('click', () => {
        const lat = parseFloat(item.lat), lng = parseFloat(item.lon);
        map.setView([lat, lng], 17);
        searchResults.style.display = 'none';
        searchInput.value = '';
        searchInput.blur();

        // Add pin if not exists
        const id = lat.toFixed(6) + ',' + lng.toFixed(6);
        if (!pins[id]) {
          pins[id] = { lat, lng, addr: item.display_name.split(',').slice(0, 3).join(','), status: 'none', note: '', ts: Date.now() };
          addOrUpdateMarker(id);
          updateStats();
          savePins();
        }
        setTimeout(() => openSheet(id), 300);
      });
      searchResults.appendChild(d);
    });
    searchResults.style.display = 'block';
  } catch (e) { searchResults.style.display = 'none'; }
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('#search-bar') && !e.target.closest('#search-results')) {
    searchResults.style.display = 'none';
  }
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// Initial render
renderAllMarkers();

// Adjust map padding for header
map.whenReady(() => {
  const headerH = document.getElementById('header').offsetHeight + 70;
  map.invalidateSize();
});

window.addEventListener('resize', () => map.invalidateSize());
</script>
