name: KnoxCanvas
options:
  bundleIdPrefix: com.knoxcanvas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "3372UW6PA4"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"
# GPX walks for Debug → Simulate Location (in the project, not the app).
fileGroups:
  - Simulated Walks
targets:
  KnoxCanvas:
    type: application
    platform: iOS
    sources:
      - path: KnoxCanvas
    settings:
      base:
        # Same bundle ID as the ios/ wrapper so this build replaces it on the phone.
        PRODUCT_BUNDLE_IDENTIFIER: com.knoxcanvas.app
        INFOPLIST_FILE: KnoxCanvas/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
schemes:
  KnoxCanvas:
    build:
      targets:
        KnoxCanvas: all
    run:
      config: Debug
